<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot Joiner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>لوحة التحكم ببوت ماينكرافت</h2>

        <!-- Step Indicators -->
        <div class="steps-nav">
            <div class="step-badge active" id="badge-1">1. العنوان</div>
            <div class="step-badge" id="badge-2">2. الإعدادات</div>
            <div class="step-badge" id="badge-3">3. الفحص والتشغيل</div>
        </div>

        <!-- Step 1 -->
        <div class="step-content active" id="step-1">
            <h3>الخطوة 1: بيانات السيرفر</h3>
            <div class="input-group">
                <label>عنوان السيرفر (IP / Domain):</label>
                <input type="text" id="server-ip" placeholder="e.g. play.hypixel.net">
            </div>
            <div class="input-group">
                <label>البورت (Port):</label>
                <input type="number" id="server-port" value="25565">
            </div>
            <button class="btn" onclick="goToStep(2)">التالي</button>
        </div>

        <!-- Step 2 -->
        <div class="step-content" id="step-2">
            <h3>الخطوة 2: إعدادات البوت</h3>
            <div class="input-group">
                <label>اسم الحساب (Bot Username):</label>
                <input type="text" id="bot-username" placeholder="مثال: Player_Bot">
            </div>
            <div class="input-group">
                <label>إصدار اللعبة (1.21+):</label>
                <select id="bot-version">
                    <option value="auto">تلقائي (Auto Detect)</option>
                    <option value="1.21">1.21</option>
                    <option value="1.21.1">1.21.1</option>
                    <option value="1.21.2">1.21.2</option>
                    <option value="1.21.3">1.21.3</option>
                    <option value="1.21.4">1.21.4</option>
                </select>
            </div>
            <div class="input-group">
                <label>أمر ينفذه عند الدخول (Initial Command):</label>
                <input type="text" id="bot-cmd" placeholder="مثال: /register 123456 123456">
            </div>
            <div class="input-group">
                <label>رسالة يكتبها بالشات (اختياري):</label>
                <input type="text" id="bot-msg" placeholder="مثال: Hello World!">
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goToStep(1)">السابق</button>
                <button class="btn" onclick="fetchServerInfo()">فحص السيرفر</button>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="step-content" id="step-3">
            <h3>الخطوة 3: معلومات السيرفر وتأكيد الدخول</h3>
            <div id="server-info-card" class="card">
                <div class="loading">جاري جلب بيانات السيرفر...</div>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goToStep(2)">تعديل</button>
                <button class="btn btn-success" id="btn-connect" onclick="connectBot()" disabled>موافق ودخول الحساب</button>
            </div>
            <div id="chat-console" class="console">
                <div class="console-line text-subtle">سجل أحداث الشات والاتصال...</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
